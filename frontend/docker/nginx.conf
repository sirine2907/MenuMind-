server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Laravel API (and Swagger UI under /api/documentation). Same origin for the
    # browser, so no CORS. Buffering is off so chat answers stream (SSE).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Swagger UI assets and OpenAPI JSON served by l5-swagger.
    location /docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other path is a client-side route.
    location / {
        try_files $uri /index.html;
    }
}
